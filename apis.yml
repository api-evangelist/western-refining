description: >-
  Western Refining was an independent crude oil refiner and marketer of refined
  petroleum products headquartered in El Paso, Texas. The company operated
  refineries in El Paso, Texas; Gallup, New Mexico; and St. Paul Park, Minnesota
  before being acquired by Tesoro Corporation in 2017 for approximately $6.4
  billion. Western Refining's assets are now part of Andeavor (formerly Tesoro),
  subsequently acquired by Marathon Petroleum in 2018.
